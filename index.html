<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharma General Store | Fresh groceries delivered to your door</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #16a34a;
            --primary-dark: #15803d;
            --primary-light: #dcfce7;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --bg-body: #f9fafb;
            --bg-card: #ffffff;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.05);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: center;
            text-align: center;
        }

        @media(min-width: 640px) {
            .header-container {
                flex-direction: row;
                justify-content: space-between;
                text-align: left;
            }
        }

        .logo-area h1 {
            font-size: 1.5rem;
            color: var(--primary-dark);
            font-weight: 700;
        }

        .logo-area p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .header-meta {
            font-size: 0.875rem;
            color: var(--text-muted);
            display: flex;
            gap: 1rem;
        }

        /* Main Content */
        main {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem 1rem;
            flex: 1;
        }

        /* Categories */
        .categories-nav {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            scrollbar-width: none;
        }

        .categories-nav::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.25rem;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .product-img-container {
            width: 100%;
            height: 180px;
            background: #f3f4f6;
            position: relative;
            overflow: hidden;
        }

        .product-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .product-name {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .product-desc {
            font-size: 0.8125rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            flex: 1;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        .product-price {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        /* Floating Cart & WhatsApp */
        .floating-actions {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 99;
        }

        .float-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 12px rgb(0 0 0 / 0.15);
            cursor: pointer;
            border: none;
            text-decoration: none;
            position: relative;
            transition: transform 0.2s;
        }

        .float-btn:hover {
            transform: scale(1.05);
        }

        .cart-float {
            background: var(--primary);
        }

        .whatsapp-float {
            background: #25d366;
        }

        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ef4444;
            color: white;
            font-size: 0.75rem;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* Cart Modal / Drawer */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: flex-end;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .cart-drawer {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            height: 100%;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .modal-overlay.open .cart-drawer {
            transform: translateX(0);
        }

        .cart-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cart-header h2 {
            font-size: 1.25rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .cart-body {
            padding: 1.25rem;
            overflow-y: auto;
            flex: 1;
        }

        .cart-items-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .cart-item-details h4 {
            font-size: 0.9375rem;
            margin-bottom: 0.25rem;
        }

        .cart-item-details p {
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .qty-btn {
            background: var(--bg-body);
            border: 1px solid var(--border);
            width: 24px;
            height: 24px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .remove-item {
            color: #ef4444;
            background: none;
            border: none;
            font-size: 0.75rem;
            cursor: pointer;
            margin-left: 0.5rem;
        }

        .cart-footer {
            padding: 1.25rem;
            border-top: 1px solid var(--border);
            background: var(--bg-body);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        /* Checkout Form View inside Drawer */
        .checkout-form {
            display: flex;
            flex-direction: column;
            gap: 0.875rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .form-group label {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-group input, .form-group textarea {
            padding: 0.625rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.875rem;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary);
        }

        .hidden {
            display: none !important;
        }

        .success-screen {
            text-align: center;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .success-screen h3 {
            color: var(--primary-dark);
            font-size: 1.375rem;
        }

        .success-screen p {
            font-size: 0.9375rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo-area">
                <h1>Sharma General Store</h1>
                <p>Fresh groceries delivered to your door</p>
            </div>
            <div class="header-meta">
                <span>📍 Varanasi, UP</span>
                <span>📞 7875160724</span>
            </div>
        </div>
    </header>

    <main>
        <nav class="categories-nav" id="categoryNav">
            <button class="cat-btn active" onclick="filterProducts('All')">All Products</button>
            <button class="cat-btn" onclick="filterProducts('Groceries')">Groceries</button>
            <button class="cat-btn" onclick="filterProducts('Dairy')">Dairy</button>
            <button class="cat-btn" onclick="filterProducts('Snacks')">Snacks</button>
            <button class="cat-btn" onclick="filterProducts('Beverages')">Beverages</button>
        </nav>

        <section class="product-grid" id="productGrid">
            <!-- Dynamically populated via JavaScript -->
        </section>
    </main>

    <!-- Floating Buttons -->
    <div class="floating-actions">
        <a href="https://wa.me/917875160724?text=Hello%20Sharma%20General%20Store,%20I%20want%20to%20enquire%20about%20products." target="_blank" class="float-btn whatsapp-float" title="Chat on WhatsApp">
            <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
        </a>
        <button class="float-btn cart-float" onclick="toggleCartModal()" title="View Cart">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
            <span class="cart-badge" id="cartBadge">0</span>
        </button>
    </div>

    <!-- Cart Drawer / Modal -->
    <div class="modal-overlay" id="cartModal" onclick="handleModalClick(event)">
        <div class="cart-drawer">
            <div class="cart-header">
                <h2>Your Cart</h2>
                <button class="close-btn" onclick="toggleCartModal()">&times;</button>
            </div>
            
            <div class="cart-body" id="cartBody">
                <!-- Cart items list or checkout or success screen -->
            </div>

            <div class="cart-footer" id="cartFooter">
                <div class="cart-total">
                    <span>Grand Total:</span>
                    <span id="cartGrandTotal">₹0</span>
                </div>
                <button class="btn" style="width: 100%;" onclick="showCheckoutForm()">Proceed to Order</button>
            </div>
        </div>
    </div>

    <script>
        // Product Database
        const products = [
            {
                id: 1,
                name: "Computer Mouse",
                price: 500,
                category: "Groceries", // mapped to standard category layout
                image: "https://i.ibb.co/0R5Wqh8y/IMG-20260519-112118.jpg",
                desc: "Useful for smooth computer operation"
            },
            {
                id: 2,
                name: "Aashirvaad Atta (5kg)",
                price: 280,
                category: "Groceries",
                image: "https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=500&q=80",
                desc: "Premium whole wheat flour"
            },
            {
                id: 3,
                name: "Amul Butter (500g)",
                price: 280,
                category: "Dairy",
                image: "https://images.unsplash.com/photo-1589985270826-4b7bb135bc9d?auto=format&fit=crop&w=500&q=80",
                desc: "Fresh salted butter"
            },
            {
                id: 4,
                name: "Tata Salt (1kg)",
                price: 28,
                category: "Groceries",
                image: "https://images.unsplash.com/photo-1518110992080-b5b9f9c7dd4d?auto=format&fit=crop&w=500&q=80",
                desc: "Vacuum evaporated iodised salt"
            },
            {
                id: 5,
                name: "Fresh Farm Milk (1L)",
                price: 66,
                category: "Dairy",
                image: "https://images.unsplash.com/photo-1550583724-b2692b85b150?auto=format&fit=crop&w=500&q=80",
                desc: "Pure pasteurized cow milk"
            },
            {
                id: 6,
                name: "Lay's Classic Salted",
                price: 20,
                category: "Snacks",
                image: "https://images.unsplash.com/photo-1566478989037-eec170784d0b?auto=format&fit=crop&w=500&q=80",
                desc: "Crispy potato chips"
            },
            {
                id: 7,
                name: "Haldiram's Bhujia (400g)",
                price: 110,
                category: "Snacks",
                image: "https://images.unsplash.com/photo-1599488615731-7e5c2823ff26?auto=format&fit=crop&w=500&q=80",
                desc: "Traditional crunchy snack"
            },
            {
                id: 8,
                name: "Bru Instant Coffee (100g)",
                price: 180,
                category: "Beverages",
                image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=500&q=80",
                desc: "Rich aroma roast coffee powder"
            },
            {
                id: 9,
                name: "Taj Mahal Tea (500g)",
                price: 320,
                category: "Beverages",
                image: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?auto=format&fit=crop&w=500&q=80",
                desc: "Exquisite blended leaf tea"
            }
        ];

        // Load Cart from LocalStorage
        let cart = JSON.parse(localStorage.getItem('sharma_cart')) || [];

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts(products);
            updateCartUI();
        });

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = items.map(product => `
                <div class="product-card">
                    <div class="product-img-container">
                        <img src="${product.image}" alt="${product.name}" loading="lazy">
                    </div>
                    <div class="product-info">
                        <span class="product-category">${product.category}</span>
                        <h3 class="product-name">${product.name}</h3>
                        <p class="product-desc">${product.desc}</p>
                        <div class="product-footer">
                            <span class="product-price">₹${product.price}</span>
                            <button class="btn" onclick="addToCart(${product.id})">Add to Cart</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts(category) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if(category === 'All') {
                renderProducts(products);
            } else {
                const filtered = products.filter(p => p.category === category);
                renderProducts(filtered);
            }
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);

            if(existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            saveAndSync();
        }

        function updateQuantity(productId, change) {
            const item = cart.find(i => i.id === productId);
            if(!item) return;

            item.quantity += change;
            if(item.quantity <= 0) {
                cart = cart.filter(i => i.id !== productId);
            }
            saveAndSync();
        }

        function removeFromCart(productId) {
            cart = cart.filter(i => i.id !== productId);
            saveAndSync();
        }

        function saveAndSync() {
            localStorage.setItem('sharma_cart', JSON.stringify(cart));
            updateCartUI();
            renderCartDrawer();
        }

        function updateCartUI() {
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartBadge').innerText = totalCount;
        }

        function toggleCartModal() {
            const modal = document.getElementById('cartModal');
            modal.classList.toggle('open');
            if(modal.classList.contains('open')) {
                renderCartDrawer();
            }
        }

        function handleModalClick(event) {
            if(event.target.id === 'cartModal') {
                toggleCartModal();
            }
        }

        function renderCartDrawer() {
            const cartBody = document.getElementById('cartBody');
            const cartFooter = document.getElementById('cartFooter');
            
            if(cart.length === 0) {
                cartBody.innerHTML = `<div style="text-align: center; color: var(--text-muted); margin-top: 3rem;">Your cart is empty.</div>`;
                cartFooter.style.display = 'none';
                return;
            }

            cartFooter.style.display = 'block';
            let grandTotal = 0;

            cartBody.innerHTML = `
                <div class="cart-items-list">
                    ${cart.map(item => {
                        const subtotal = item.price * item.quantity;
                        grandTotal += subtotal;
                        return `
                            <div class="cart-item">
                                <div class="cart-item-details">
                                    <h4>${item.name}</h4>
                                    <p>₹${item.price} × ${item.quantity} = <strong>₹${subtotal}</strong></p>
                                    <div class="cart-item-actions">
                                        <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">-</button>
                                        <span>${item.quantity}</span>
                                        <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                                        <button class="remove-item" onclick="removeFromCart(${item.id})">Remove</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            document.getElementById('cartGrandTotal').innerText = `₹${grandTotal}`;
        }

        function showCheckoutForm() {
            const cartBody = document.getElementById('cartBody');
            const cartFooter = document.getElementById('cartFooter');
            cartFooter.style.display = 'none';

            let grandTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            let orderSummaryString = cart.map(i => `${i.name} (x${i.quantity}) - ₹${i.price * i.quantity}`).join('\n');
            orderSummaryString += `\nGrand Total: ₹${grandTotal}`;

            // Using Formspree endpoint (Shop owner can replace ID later if needed)
            cartBody.innerHTML = `
                <form class="checkout-form" action="https://formspree.io/f/xlgppwaz" method="POST" onsubmit="handleOrderSubmission(event)">
                    <input type="hidden" name="order_summary" value="${orderSummaryString}">
                    
                    <div class="form-group">
                        <label>Customer Name *</label>
                        <input type="text" name="customer_name" required placeholder="Enter your full name">
                    </div>
                    <div class="form-group">
                        <label>Phone Number *</label>
                        <input type="tel" name="customer_phone" required placeholder="10-digit mobile number">
                    </div>
                    <div class="form-group">
                        <label>Delivery Address *</label>
                        <textarea name="delivery_address" rows="3" required placeholder="House no, Street, Landmark, Area"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Special Instructions (Optional)</label>
                        <input type="text" name="instructions" placeholder="e.g., Deliver by evening">
                    </div>
                    <button type="submit" class="btn" style="margin-top: 0.5rem; width: 100%;">Place Order</button>
                </form>
            `;
        }

        async function handleOrderSubmission(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    cart = [];
                    localStorage.removeItem('sharma_cart');
                    updateCartUI();

                    const cartBody = document.getElementById('cartBody');
                    cartBody.innerHTML = `
                        <div class="success-screen">
                            <h3>Order Placed Successfully!</h3>
                            <p>Sharma General Store will contact you on WhatsApp to confirm availability, exact pricing, and delivery timeline.</p>
